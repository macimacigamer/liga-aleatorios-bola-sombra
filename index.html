<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liga Aleatoria PVP Bola Sombra</title>
<style>
:root{--bg:#0a0512;--card:#170d2b;--card2:#21133e;--line:#4b2a86;--glow:#a855f7;--pink:#f472b6;--tx:#f5ecff;--mut:#b7a0d9;--ok:#4ade80;--bad:#fb7185;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#3b1670 0,transparent 60%),var(--bg);color:var(--tx);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;min-height:100vh}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.smoke{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none;animation:dr 22s ease-in-out infinite alternate}
.s1{background:#7e22ce;left:-20vmax;top:10vh}.s2{background:#be185d;right:-25vmax;bottom:-10vh;animation-delay:-9s;opacity:.18}
@keyframes dr{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
.app{position:relative;z-index:1;max-width:1050px;margin:0 auto;padding:14px}
header{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;align-items:center;background:linear-gradient(135deg,#2a1255cc,#12081fcc);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 0 40px #7e22ce55;position:relative;overflow:hidden}
h1{margin:0;font-size:clamp(26px,5.2vw,46px);line-height:1.05;letter-spacing:1px;background:linear-gradient(90deg,#fff,#d8b4fe 40%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #a855f7}
.sub{color:var(--mut);margin:10px 0 0;font-style:italic}
.hero{position:relative;height:300px;display:grid;place-items:center}
.orb{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9d5ff,#a855f7 35%,#3b0764 75%);box-shadow:0 0 60px #a855f7,inset 0 0 30px #0008;animation:pu 3.4s ease-in-out infinite;opacity:.8}
@keyframes pu{50%{transform:scale(1.12);box-shadow:0 0 90px #d946ef,inset 0 0 30px #0008}}
.hero img{position:relative;display:block;width:auto;height:auto;max-width:100%;max-height:290px;animation:fl 5s ease-in-out infinite}
.ph{position:relative;font-size:110px;filter:drop-shadow(0 0 22px #a855f7);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0a0512d9;backdrop-filter:blur(8px);padding:8px;border-radius:16px;border:1px solid var(--line)}
nav button,.btn,.chip{cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:12px;padding:9px 14px;font:inherit;transition:.2s}
nav button:hover,.btn:hover,.chip:hover{border-color:var(--glow);box-shadow:0 0 14px #a855f78a;transform:translateY(-1px)}
nav button.on,.chip.on{background:linear-gradient(135deg,#7e22ce,#c026d3);border-color:#e9d5ff}
.btn.pk{background:linear-gradient(135deg,#be185d,#7e22ce)}.btn.dg{border-color:var(--bad);color:var(--bad)}
.sp{flex:1}.sv{font-size:13px;align-self:center;color:var(--mut)}.sv.ok{color:var(--ok)}.sv.err{color:var(--bad)}
.lg{opacity:.55;font-size:12px;padding:6px 10px}.lg:hover{opacity:1}
h2::before{content:"";display:inline-block;width:36px;height:33px;background:var(--g) center/contain no-repeat;margin-right:10px;vertical-align:middle}h2{margin:6px 0 14px;color:#e9d5ff;text-shadow:0 0 18px #a855f7}h3{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px;transition:.25s}
.card:hover{border-color:var(--glow);box-shadow:0 0 22px #a855f760;transform:translateY(-2px)}
.card b.big{display:block;font-size:26px;color:var(--pink)}.card small{color:var(--mut)}
.wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:11px 10px;text-align:center;border-bottom:1px solid #2d1b52}th{background:#2a1255;color:#e9d5ff;font-size:13px}
td.nm{text-align:left;font-weight:700}td.pt{font-weight:800;color:var(--pink);font-size:18px}
tr.top td{background:#3b167020}tr.t1 td{background:linear-gradient(90deg,#c026d340,#7e22ce30);font-size:18px;box-shadow:inset 0 0 18px #f472b633}
tr.t1 td.nm{color:#fff;text-shadow:0 0 12px var(--pink)}
.f{display:none}@media(min-width:760px){.f{display:inline}.s{display:none}}
@media(max-width:700px){header{grid-template-columns:1fr}.hero{height:220px}.hero img{max-height:210px}.orb{width:110px;height:110px}.ph{font-size:80px}}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip.fin{border-left:4px solid var(--ok)}.chip.pen{border-left:4px solid var(--pink)}
.bd{font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid}.bd.fin{color:var(--ok);border-color:var(--ok)}.bd.pen{color:var(--pink);border-color:var(--pink)}
.mt{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
.side{display:flex;flex-direction:column;gap:4px}.vs{color:var(--pink);font-weight:800}
@media(max-width:700px){.mt{grid-template-columns:1fr auto 1fr}.mt .btn{grid-column:1/-1}}
.rw{font-weight:700}.rw.W{color:var(--ok)}.rw.L{color:var(--bad)}.rw.N{color:var(--mut)}
select,input[type=text],input[type=password],textarea{background:#10081f;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;max-width:100%}
textarea{width:100%;min-height:130px;font:12px monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.hc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;border-left:5px solid var(--pink)}.hc.fin{border-left-color:var(--ok)}
.hh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px;cursor:pointer}.hh:hover{background:#2a125533}.hb{padding:0 14px 14px}
.ov{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;padding:16px}.ov.on{display:grid}
.box{background:var(--card);border:1px solid var(--glow);border-radius:18px;padding:22px;width:min(380px,100%);box-shadow:0 0 50px #a855f7aa}.box input{width:100%;margin:6px 0}
#lerr{color:var(--bad);min-height:20px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#7e22ce;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;z-index:30;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
.tm{display:flex;gap:8px;align-items:center;margin:6px 0}.tm input{flex:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

<script>
const KEY='bolasombra_liga_v1',P={W:2,L:1,N:0},RL={W:'Victoria',L:'Derrota',N:'No presentación'};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF={teams:[],rounds:[],img:'',cred:{user:'admin',salt:'bs-gengar-v1',hash:'29e402542ac036088dfa1a43756aa77dbd828c9d0119e0e50caa5d83ffa32794'}};
let S=load(),admin=false,view='inicio',cur=null,H=[],selT=null,armed=null;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.teams)&&Array.isArray(d.rounds))return Object.assign(structuredClone(DEF),d)}catch(e){}return structuredClone(DEF)}
function save(){const e=$('#sv');try{localStorage.setItem(KEY,JSON.stringify(S));if(e){e.className='sv ok';e.textContent='● Guardado '+new Date().toLocaleTimeString('es-ES')}}catch(x){if(e){e.className='sv err';e.textContent='⚠ No se pudo guardar'}}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function ask(k){if(armed===k){armed=null;return true}armed=k;toast('Pulsa otra vez para confirmar');setTimeout(()=>{if(armed===k)armed=null},3500);return false}
function mut(fn){if(!admin){toast('Requiere acceso de administrador');return}fn();save();render()}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const tok=n=>sha('sess|'+S.cred.hash+'|'+n);
async function login(u,p){if(u===S.cred.user&&await sha(S.cred.salt+p)===S.cred.hash){const n=uid()+uid();try{sessionStorage.setItem('bs_n',n);sessionStorage.setItem('bs_t',await tok(n))}catch(e){}admin=true;return true}return false}
async function restore(){try{const n=sessionStorage.getItem('bs_n'),t=sessionStorage.getItem('bs_t');if(n&&t&&await tok(n)===t){admin=true;render()}}catch(e){}}
/* ---- cálculo ---- */
const isDone=m=>m.a&&m.b&&m.ra&&m.rb, fin=r=>r.matches.length>0&&r.matches.every(isDone);
const tn=id=>(S.teams.find(t=>t.id===id)||{name:'—'}).name;
function calc(){const t={};S.teams.forEach(x=>t[x.id]={id:x.id,name:x.name,W:0,L:0,N:0,pj:0,pts:0,log:[]});
S.rounds.forEach(r=>r.matches.forEach(m=>{if(!isDone(m)||!t[m.a]||!t[m.b])return;[[m.a,m.ra,m.b],[m.b,m.rb,m.a]].forEach(([id,v,o])=>{const x=t[id];x[v]++;x.pj++;x.pts+=P[v];x.log.push({r:r.title,opp:tn(o),v})})}));
const rows=Object.values(t).sort((a,b)=>b.pts-a.pts||b.W-a.W||a.name.localeCompare(b.name));
rows.forEach(r=>r.pos=1+rows.filter(o=>o.pts>r.pts||(o.pts===r.pts&&o.W>r.W)).length);return rows}
/* ---- vistas ---- */
const h=(f,s)=>`<span class=f>${f}</span><span class=s>${s}</span>`,medal=p=>p===1?'👑':p===2?'🥈':p===3?'🥉':'';
const badge=r=>`<span class="bd ${fin(r)?'fin':'pen'}">${fin(r)?'Finalizada':'Pendiente'}</span>`;
function tbl(rows){if(!rows.length)return'<p class=empty>Todavía no hay equipos registrados.</p>';
return`<div class=wrap><table><thead><tr><th>${h('Posición','#')}</th><th>Equipo</th><th>${h('Partidas jugadas','PJ')}</th><th>${h('Victorias','V')}</th><th>${h('Derrotas','D')}</th><th>${h('No presentaciones','NP')}</th><th>${h('Puntos totales','Pts')}</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.pos<=3?'top t'+r.pos:''}"><td>${medal(r.pos)} ${r.pos}</td><td class=nm>${esc(r.name)}</td><td>${r.pj}</td><td>${r.W}</td><td>${r.L}</td><td>${r.N}</td><td class=pt>${r.pts}</td></tr>`).join('')}</tbody></table></div>`}
function mHTML(r,m,ed){const opts=s=>S.teams.map(t=>`<option value="${t.id}" ${t.id===s?'selected':''}>${esc(t.name)}</option>`).join('');
const rs=(s,v)=>`<select data-ch=res data-r=${r.id} data-m=${m.id} data-s=${s}><option value="">Sin resultado</option>${Object.keys(RL).map(k=>`<option value=${k} ${v===k?'selected':''}>${RL[k]}</option>`).join('')}</select>`;
const side=(s,id,v)=>`<div class=side>${ed?`<select data-ch=mt data-r=${r.id} data-m=${m.id} data-s=${s}>${opts(id)}</select>`:`<b>${esc(tn(id))}</b>`}${ed?rs(s,v):v?`<span class="rw ${v}">${RL[v]}${isDone(m)?` · +${P[v]} pts`:''}</span>`:'<span class=rw>Sin resultado</span>'}</div>`;
return`<div class=mt>${side('a',m.a,m.ra)}<span class=vs>VS</span>${side('b',m.b,m.rb)}${ed?`<button class="btn dg" data-a=delMatch data-r=${r.id} data-m=${m.id}>Quitar</button>`:''}</div>`}
function inicio(){const rows=calc(),pl=rows.some(r=>r.pj),fr=S.rounds.filter(fin).length;
return`<h2>Inicio</h2><div class=grid><div class=card><small>Equipos</small><b class=big>${S.teams.length}</b></div><div class=card><small>Jornadas finalizadas</small><b class=big>${fr}/${S.rounds.length}</b></div><div class=card><small>Sistema de puntos</small><b>Victoria +2 · Derrota +1 · No presentación 0</b></div></div>
<h2 style="margin-top:22px">Podio</h2>${pl?tbl(rows.filter(r=>r.pos<=3)):'<p class=empty>La liga empieza cuando se registren los primeros resultados.</p>'}`}
function clas(){return`<h2>Clasificación general</h2>${tbl(calc())}<p><small style="color:var(--mut)">Desempate: más victorias. Si persiste, misma posición.</small></p>`}
function jor(){const rs=S.rounds;if(!rs.length)return`<h2>Jornadas</h2><p class=empty>Aún no hay jornadas.</p>${admin?'<button class="btn pk" data-a=addRound>+ Crear jornada</button>':''}`;
if(!rs.find(r=>r.id===cur))cur=rs[0].id;const r=rs.find(x=>x.id===cur),o=S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
return`<h2>Jornadas</h2><div class=chips>${rs.map(x=>`<button class="chip ${x.id===cur?'on':''} ${fin(x)?'fin':'pen'}" data-a=selRound data-id=${x.id}>${esc(x.title)}</button>`).join('')}${admin?'<button class="btn pk" data-a=addRound>+ Nueva</button>':''}</div>
<div class=card><div class=row>${admin?`<input type=text value="${esc(r.title)}" data-ch=rt data-r=${r.id}>`:`<h3>${esc(r.title)}</h3>`}${badge(r)}<span class=sp></span>${admin?`<button class="btn dg" data-a=delRound data-id=${r.id}>Eliminar jornada</button>`:''}</div>
${r.matches.map(m=>mHTML(r,m,admin)).join('')||'<p class=empty>Sin enfrentamientos.</p>'}
${admin?`<div class=row><select id=ma>${o}</select><span class=vs>VS</span><select id=mb>${o}</select><button class="btn pk" data-a=addMatch data-id=${r.id}>Añadir enfrentamiento</button></div>`:''}</div>`}
function histV(){return`<h2>Historial de jornadas</h2>${S.rounds.length?S.rounds.map(r=>`<article class="hc ${fin(r)?'fin':'pen'}"><div class=hh data-a=toggleH data-id=${r.id}><h3>${esc(r.title)}</h3>${badge(r)}<small style="color:var(--mut)">${r.matches.length} enfrentamientos · ${H.includes(r.id)?'ocultar':'ver'}</small></div>${H.includes(r.id)?`<div class=hb>${r.matches.map(m=>mHTML(r,m,false)).join('')||'<p class=empty>Sin enfrentamientos.</p>'}${admin?`<button class=btn data-a=editRound data-id=${r.id}>Editar en Jornadas</button>`:''}</div>`:''}</article>`).join(''):'<p class=empty>Aún no hay jornadas.</p>'}`}
function stats(){const rows=calc(),mx=k=>{const v=Math.max(0,...rows.map(r=>r[k]));return v?rows.filter(r=>r[k]===v).map(r=>esc(r.name)).join(', ')+` (${v})`:'—'};
const nm=S.rounds.reduce((a,r)=>a+r.matches.filter(isDone).length,0),fr=S.rounds.filter(fin).length;
if(!rows.find(r=>r.id===selT))selT=rows[0]&&rows[0].id;const t=rows.find(r=>r.id===selT);
return`<h2>Estadísticas</h2><div class=grid><div class=card><small>Más victorias</small><b class=big style="font-size:18px">${mx('W')}</b></div><div class=card><small>Más puntos</small><b class=big style="font-size:18px">${mx('pts')}</b></div><div class=card><small>Enfrentamientos disputados</small><b class=big>${nm}</b></div><div class=card><small>Jornadas finalizadas</small><b class=big>${fr}</b></div><div class=card><small>Jornadas pendientes</small><b class=big>${S.rounds.length-fr}</b></div></div>
<h2 style="margin-top:22px">Estadísticas por equipo</h2>${t?`<select data-ch=tsel>${rows.map(r=>`<option value=${r.id} ${r.id===selT?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
<div class=grid style="margin-top:12px"><div class=card><small>Posición</small><b class=big>${t.pos}º</b></div><div class=card><small>Puntos</small><b class=big>${t.pts}</b></div><div class=card><small>V / D / NP</small><b class=big>${t.W} / ${t.L} / ${t.N}</b></div><div class=card><small>% victorias</small><b class=big>${t.pj?Math.round(100*t.W/t.pj):0}%</b></div></div>
${t.log.map(l=>`<div class=mt style="grid-template-columns:1fr 1fr 1fr"><span>${esc(l.r)}</span><span>vs ${esc(l.opp)}</span><span class="rw ${l.v}">${RL[l.v]} (+${P[l.v]})</span></div>`).join('')}`:'<p class=empty>Sin equipos.</p>'}`}
function adm(){return`<h2>Panel de administración</h2><div class=card><h3>Equipos</h3><div class=row><input type=text id=nt placeholder="Nombre del equipo"><button class="btn pk" data-a=addTeam>Añadir</button></div>${S.teams.map(t=>`<div class=tm><input type=text value="${esc(t.name)}" data-ch=rn data-id=${t.id}><button class="btn dg" data-a=delTeam data-id=${t.id}>Eliminar</button></div>`).join('')||'<p class=empty>Sin equipos.</p>'}</div>
<div class=card style="margin-top:12px"><h3>Datos de la liga</h3><div class=row><button class=btn data-a=doExport>Exportar</button><button class=btn data-a=doImport>Importar</button><input type=file accept=".json,application/json" data-ch=file></div><textarea id=io placeholder="Aquí aparece el JSON exportado. Para importar, pégalo aquí o elige un archivo y pulsa Importar."></textarea></div>
<div class=card style="margin-top:12px"><h3>Cambiar credenciales</h3><div class=row><input type=text id=nu placeholder="Nuevo usuario"><input type=password id=np placeholder="Nueva contraseña (mín. 6)"><button class="btn pk" data-a=setCred>Guardar</button></div></div>
<div class=card style="margin-top:12px"><button class="btn dg" data-a=reset>Borrar equipos y jornadas</button></div>`}
function render(){if(!$('#himg').firstChild)$('#himg').innerHTML='<img src="'+GENGAR+'" alt="Gengar" width="800" height="738">';
if(view==='adm'&&!admin)view='inicio';const T=[['inicio','Inicio'],['clas','Clasificación'],['jor','Jornadas'],['hist','Historial'],['stats','Estadísticas']];if(admin)T.push(['adm','Admin']);
$('#nav').innerHTML=T.map(([k,l])=>`<button class="${view===k?'on':''}" data-a=v data-v=${k}>${l}</button>`).join('')+`<span class=sp></span><span class="sv" id=sv>● Datos cargados</span>`+(admin?'<button class="btn lg" data-a=logout>CERRAR SESIÓN</button>':'<button class="btn lg" data-a=openLogin>ACCESO ADMIN</button>');
$('#main').innerHTML=({inicio,clas,jor,hist:histV,stats,adm})[view]()}
/* ---- eventos ---- */
const gm=(r,m)=>S.rounds.find(x=>x.id===r).matches.find(x=>x.id===m);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==='v'){view=b.dataset.v;render()}
else if(a==='openLogin'){$('#login').classList.add('on');$('#lu').focus()}
else if(a==='closeLogin')$('#login').classList.remove('on');
else if(a==='doLogin'){if(await login($('#lu').value.trim(),$('#lp').value)){$('#login').classList.remove('on');$('#lp').value='';$('#lerr').textContent='';render()}else $('#lerr').textContent='Usuario o contraseña incorrectos.'}
else if(a==='logout'){admin=false;try{sessionStorage.clear()}catch(x){}render()}
else if(a==='selRound'){cur=id;render()}
else if(a==='toggleH'){H=H.includes(id)?H.filter(x=>x!==id):[...H,id];render()}
else if(a==='editRound'){cur=id;view='jor';render()}
else if(a==='addTeam'){const n=$('#nt').value.trim();if(!n)return toast('Escribe un nombre');if(S.teams.some(t=>t.name.toLowerCase()===n.toLowerCase()))return toast('Ese equipo ya existe');mut(()=>S.teams.push({id:uid(),name:n}))}
else if(a==='delTeam'){if(admin&&ask('t'+id))mut(()=>{S.teams=S.teams.filter(t=>t.id!==id);S.rounds.forEach(r=>r.matches=r.matches.filter(m=>m.a!==id&&m.b!==id))})}
else if(a==='addRound')mut(()=>{const r={id:uid(),title:'Jornada '+(S.rounds.length+1),matches:[]};S.rounds.push(r);cur=r.id})
else if(a==='delRound'){if(admin&&ask('r'+id))mut(()=>{S.rounds=S.rounds.filter(r=>r.id!==id);cur=null})}
else if(a==='addMatch'){const x=$('#ma').value,y=$('#mb').value,r=S.rounds.find(r=>r.id===id);if(!x||!y)return toast('Primero añade equipos');if(x===y)return toast('Elige dos equipos distintos');if(r.matches.some(m=>(m.a===x&&m.b===y)||(m.a===y&&m.b===x)))return toast('Ese enfrentamiento ya está en la jornada');mut(()=>r.matches.push({id:uid(),a:x,b:y,ra:'',rb:''}))}
else if(a==='delMatch'){if(admin&&ask('m'+b.dataset.m))mut(()=>{const r=S.rounds.find(r=>r.id===b.dataset.r);r.matches=r.matches.filter(m=>m.id!==b.dataset.m)})}
else if(a==='doExport'){if(!admin)return;const d={teams:S.teams,rounds:S.rounds,img:S.img};$('#io').value=JSON.stringify(d,null,1);$('#io').select();try{navigator.clipboard.writeText($('#io').value);toast('JSON copiado')}catch(x){toast('Copia el texto seleccionado')}}
else if(a==='doImport'){if(!admin)return;let d;try{d=JSON.parse($('#io').value)}catch(x){return toast('JSON no válido')}if(!d||!Array.isArray(d.teams)||!Array.isArray(d.rounds))return toast('Formato no válido');if(ask('imp'))mut(()=>{S.teams=d.teams.map(t=>({id:String(t.id),name:String(t.name)}));S.rounds=d.rounds.map(r=>({id:String(r.id),title:String(r.title),matches:(r.matches||[]).map(m=>({id:String(m.id),a:String(m.a),b:String(m.b),ra:RL[m.ra]?m.ra:'',rb:RL[m.rb]?m.rb:''}))}));if(typeof d.img==='string'&&d.img.startsWith('data:image/'))S.img=d.img;cur=null})}
else if(a==='rmImg')mut(()=>{S.img=''})
else if(a==='setCred'){if(!admin)return;const u=$('#nu').value.trim(),p=$('#np').value;if(!u||p.length<6)return toast('Usuario y contraseña de 6+ caracteres');const salt=uid()+uid(),hash=await sha(salt+p);mut(()=>{S.cred={user:u,salt,hash}});$('#nu').value=$('#np').value='';toast('Credenciales actualizadas')}
else if(a==='reset'){if(admin&&ask('reset'))mut(()=>{S.teams=[];S.rounds=[];cur=null})}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.ch;if(!c)return;
if(c==='tsel'){selT=t.value;render()}
else if(c==='res')mut(()=>{const m=gm(t.dataset.r,t.dataset.m),s=t.dataset.s,o=s==='a'?'b':'a',v=t.value;m['r'+s]=v;if(!m['r'+o]){if(v==='W')m['r'+o]='L';if(v==='L')m['r'+o]='W'}})
else if(c==='mt'){const m=gm(t.dataset.r,t.dataset.m),s=t.dataset.s,o=s==='a'?'b':'a';if(m[o]===t.value){toast('Los dos equipos no pueden ser el mismo');return render()}mut(()=>{m[s]=t.value})}
else if(c==='rt')mut(()=>{const r=S.rounds.find(r=>r.id===t.dataset.r);r.title=t.value.trim()||r.title})
else if(c==='rn'){const n=t.value.trim();if(!n||S.teams.some(x=>x.id!==t.dataset.id&&x.name.toLowerCase()===n.toLowerCase())){toast('Nombre vacío o repetido');return render()}mut(()=>{S.teams.find(x=>x.id===t.dataset.id).name=n})}
else if(c==='file'&&t.files[0]){const f=new FileReader();f.onload=()=>{$('#io').value=f.result;toast('Archivo cargado: pulsa Importar')};f.readAsText(t.files[0])}
else if(c==='img'&&t.files[0]){const f=new FileReader();f.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);mut(()=>{S.img=cv.toDataURL('image/png')})};im.src=f.result};f.readAsDataURL(t.files[0])}});
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('[data-a=doLogin]').click()});
/* ---- partículas ---- */
(function(){const c=$('#fx'),x=c.getContext('2d');let w,hh,p=[];const rs=()=>{w=c.width=innerWidth;hh=c.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<45;i++)p.push({x:Math.random()*w,y:Math.random()*hh,r:Math.random()*2.4+.6,v:Math.random()*.4+.15,a:Math.random()});
(function f(){x.clearRect(0,0,w,hh);p.forEach(q=>{q.y-=q.v;q.a+=.01;if(q.y<-5){q.y=hh+5;q.x=Math.random()*w}x.beginPath();x.fillStyle=`rgba(216,180,254,${.15+.35*Math.abs(Math.sin(q.a))})`;x.arc(q.x,q.y,q.r,0,7);x.fill()});requestAnimationFrame(f)})()})();
render();restore();
</script></body></html>
